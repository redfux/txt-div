<!-- thought up by human, created by ai -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none';">
  <title>txt-div</title>
  <script>
    // System-Theme vor dem ersten Render setzen, verhindert Flash
    document.documentElement.dataset.theme =
      window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
  <style>
    /* ── CSS-Variablen: Dark/Light ───────────────────────────────────────── */
    :root {
      --bg:          #1a1a2e;
      --bg2:         #16213e;
      --bg3:         #111827;
      --border:      #0f3460;
      --border2:     #1f2937;
      --accent:      #23a96a;
      --accent-h:    #075033;
      --btn-bg:      #0f3460;
      --btn-bg-h:    #1a4a80;
      --text:        #e0e0e0;
      --text-dim:    #a0a0b0;
      --text-num:    #555;
      --text-hdr:    #a0c0e0;
      --stats-col:   #888;
      --ph-col:      #444;
      --line-border: rgba(255,255,255,0.03);
      --empty-bg:    rgba(255,255,255,0.02);
      --minimap-bg:  #0d1525;
      --minimap-cur: rgba(255,255,255,0.12);
      --nav-bg:      #16213e;
      --switch:      #23a96a;   /* Thumb der Toggle-Switches, in beiden Themes gleich */
    }
    [data-theme="light"] {
      --bg:          #f5f5f5;
      --bg2:         #ffffff;
      --bg3:         #e8eaf0;
      --border:      #c5cde0;
      --border2:     #d8dce8;
      --accent:      #23a96a;
      --accent-h:    #075033;
      --btn-bg:      #dde3f0;
      --btn-bg-h:    #c5cde0;
      --text:        #1a1a2e;
      --text-dim:    #555577;
      --text-num:    #9090a0;
      --text-hdr:    #334466;
      --stats-col:   #667788;
      --ph-col:      #aaa;
      --line-border: rgba(0,0,0,0.04);
      --empty-bg:    rgba(0,0,0,0.02);
      --minimap-bg:  #e0e4ef;
      --minimap-cur: rgba(0,0,0,0.12);
      --nav-bg:      #eef0f8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      background: var(--bg2);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      flex: 1;
    }

    /* ── Toggle-Switches (Theme, Auswahl-Modus) ──────────────────────────── */
    .theme-toggle,
    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }

    .toggle-track {
      width: 36px; height: 20px;
      border-radius: 10px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--switch);
      transition: transform 0.2s;
    }

    /* Auf .theme-toggle eingeschränkt, sonst würde der Modus-Switch im
       Light-Theme mitwandern. Der Modus-Switch schaltet über .on. */
    [data-theme="light"] .theme-toggle .toggle-thumb { transform: translateX(16px); }

    /* Der Modus-Switch ist beidseitig beschriftet: Thumb links = Zeilenweise
       (Label links), Thumb rechts = Blockweise. .on steht daher für
       Blockweise, nicht für lineMode. */
    .mode-toggle.on .toggle-thumb { transform: translateX(16px); }

    .mode-opt { transition: color 0.2s; }

    .mode-opt.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* ── Upload Bar ──────────────────────────────────────────────────────── */
    .upload-bar {
      background: var(--bg2);
      padding: 12px 20px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 200px;
    }

    .upload-group label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* block, damit das Feld die ganze Gruppenbreite einnimmt — sonst bliebe
       rechts davon Leerraum und der Tausch-Button rückte an Datei B heran */
    .file-btn { position: relative; display: block; }

    .file-btn input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer; width: 100%;
    }

    .file-btn span {
      display: block;
      padding: 7px 14px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text);
    }

    .file-btn:hover span { background: var(--btn-bg-h); }

    .compare-btn {
      padding: 8px 22px;
      background: var(--accent);
      border: none; border-radius: 6px;
      color: white; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }

    .compare-btn:hover { background: var(--accent-h); }
    .compare-btn:disabled { background: var(--btn-bg); color: var(--text-dim); cursor: not-allowed; }

    /* Tausch-Button zwischen den beiden Dateiauswahlen */
    .swap-btn {
      padding: 6px 12px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1.05rem; line-height: 1.25;
      cursor: pointer; transition: background 0.2s;
      flex-shrink: 0;
    }

    .swap-btn:hover:not(:disabled) { background: var(--btn-bg-h); }
    .swap-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Nav + Legend Bar ────────────────────────────────────────────────── */
    .toolbar {
      background: var(--nav-bg);
      padding: 7px 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .nav-group { display: flex; align-items: center; gap: 6px; }

    .nav-btn {
      padding: 4px 12px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text); font-size: 0.82rem;
      cursor: pointer; transition: background 0.15s; line-height: 1.4;
    }

    .nav-btn:hover { background: var(--btn-bg-h); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .nav-counter {
      font-size: 0.8rem; color: var(--text-dim);
      min-width: 60px; text-align: center;
    }

    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; }

    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: var(--text-dim);
    }

    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    .dot-added   { background: rgba(50,180,80,.6);  border: 1px solid #32b450; }
    .dot-changed { background: rgba(220,140,30,.6); border: 1px solid #dc8c1e; }
    .dot-removed { background: rgba(220,60,60,.6);  border: 1px solid #dc3c3c; }

    /* ── Main Layout ─────────────────────────────────────────────────────── */
    .diff-wrapper {
      display: flex; flex: 1; overflow: hidden; min-height: 0;
    }

    .diff-container { display: flex; flex: 1; overflow: hidden; }

    .diff-pane {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; border-right: 1px solid var(--border);
    }

    .diff-pane:last-child { border-right: none; }

    .pane-header {
      padding: 6px 14px;
      background: var(--btn-bg);
      font-size: 0.78rem; color: var(--text-hdr);
      font-weight: 600; letter-spacing: 0.04em;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    /* position: relative macht den Container zum offsetParent seiner Zeilen —
       nur dann ist row.offsetTop direkt als scrollTop verwendbar. */
    .pane-content {
      overflow: auto; flex: 1; position: relative;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.84rem; line-height: 1.6;
    }

    /* Jede Zeile enthält in beiden Panes dieselben drei Bausteine, nur
       spiegelbildlich angeordnet — Pane A: line-num | line-text | merge-cell,
       Pane B: line-num | merge-cell | line-text. Da die merge-cell in beiden
       Panes gleich breit ist, bleibt die Textspalte identisch breit, sodass
       Zeilen an denselben Stellen umbrechen und 1:1 fluchten. */
    .line {
      display: flex; min-height: 1.6em;
      border-bottom: 1px solid var(--line-border);
    }

    .line.current-diff {
      outline: 2px solid var(--accent); outline-offset: -2px;
      z-index: 1; position: relative;
    }

    .line-num {
      min-width: 44px; padding: 0 8px; text-align: right;
      color: var(--text-num); background: var(--bg3);
      user-select: none; border-right: 1px solid var(--border2);
      font-size: 0.76rem; line-height: 1.6; flex-shrink: 0;
    }

    /* Umbruch bevorzugt an Leerzeichen; nur ein einzelnes zu langes Wort
       wird mittendrin getrennt. min-width: 0 lässt das Flex-Kind schrumpfen,
       damit der Umbruch überhaupt greift. */
    .line-text {
      padding: 0 12px; white-space: pre-wrap;
      overflow-wrap: anywhere; word-break: normal;
      flex: 1; min-width: 0;
    }

    .line.added   .line-text { background: rgba(50,180,80,.15); }
    .line.removed .line-text { background: rgba(220,60,60,.15); }
    .line.changed .line-text { background: rgba(220,140,30,.15); }
    .line.empty   .line-text { background: var(--empty-bg); color: transparent; }

    mark.added   { background: rgba(50,180,80,.5);  border-radius: 2px; color: inherit; }
    mark.removed { background: rgba(220,60,60,.5);  border-radius: 2px; color: inherit; }
    mark.changed { background: rgba(220,140,30,.5); border-radius: 2px; color: inherit; }

    /* ── Merge-Pfeile ────────────────────────────────────────────────────────
       Je ein Pfeil pro Seite, beide zur Mittellinie hin: in Pane A hinter dem
       Text, in Pane B vor dem Text. Beide Panes behalten dabei genau eine
       merge-cell gleicher Breite, damit die Textspalten gleich breit bleiben
       und Zeilen an denselben Stellen umbrechen. */
    .merge-cell {
      width: 26px; flex-shrink: 0;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 1px 3px 0;
    }

    .merge-btn {
      width: 20px; height: 20px;
      border: 1px solid var(--border); border-radius: 3px;
      background: var(--btn-bg); color: var(--text-dim);
      font-size: 0.8rem;
      cursor: pointer; padding: 0; line-height: 1;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: flex; align-items: center; justify-content: center;
    }

    .merge-btn:hover { background: var(--btn-bg-h); color: var(--text); }

    /* Gewählte Seite — einheitliche Auswahlfarbe, die Seite ergibt sich
       bereits aus der Position des Pfeils */
    .merge-btn.active {
      background: rgba(50,150,255,0.3);
      border-color: #3296ff;
      color: #2b7fd4;
    }

    [data-theme="dark"] .merge-btn.active { color: #80c0ff; }

    .line.chosen .line-text {
      outline: 1px dashed rgba(50,150,255,0.6);
      outline-offset: -1px;
    }

    /* ── Result Area ─────────────────────────────────────────────────────── */
    .result-area {
      flex-shrink: 0; border-top: 2px solid var(--border);
    }

    .result-toggle {
      padding: 6px 16px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      font-size: 0.82rem; color: var(--text-dim);
      background: var(--nav-bg); border-bottom: 1px solid transparent;
    }

    .result-toggle:hover { color: var(--text); }

    .result-chevron { display: inline-block; transition: transform 0.18s; }

    .result-area.open .result-chevron { transform: rotate(90deg); }
    .result-area.open .result-toggle  { border-bottom-color: var(--border); }

    .result-panels { display: none; height: 250px; }
    .result-area.open .result-panels { display: flex; }

    .result-pane {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }

    .result-pane-header {
      padding: 5px 12px; background: var(--btn-bg);
      font-size: 0.78rem; color: var(--text-hdr); font-weight: 600;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; gap: 8px;
    }

    .result-actions { display: flex; gap: 5px; }

    .result-btn {
      padding: 2px 9px; background: var(--btn-bg);
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-size: 0.75rem;
      cursor: pointer; transition: background 0.15s;
    }

    .result-btn:hover { background: var(--btn-bg-h); }

    .result-content {
      overflow: auto; flex: 1; position: relative;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.84rem; line-height: 1.6;
    }

    /* Alle Zeilen aus Diff-Positionen hellblau, egal ob A oder B gewählt */
    .line.diff-line .line-text { background: rgba(50,150,255,0.18); }

    /* ── Minimap ─────────────────────────────────────────────────────────── */
    .minimap {
      width: 20px; background: var(--minimap-bg);
      border-left: 1px solid var(--border);
      position: relative; flex-shrink: 0; cursor: pointer; overflow: hidden;
    }

    .minimap-track { position: absolute; inset: 0; }

    .minimap-seg {
      position: absolute; left: 2px; right: 2px;
      border-radius: 2px; min-height: 2px;
    }

    .minimap-seg.added   { background: rgba(50,180,80,.75); }
    .minimap-seg.changed { background: rgba(220,140,30,.75); }
    .minimap-seg.removed { background: rgba(220,60,60,.75); }

    .minimap-viewport {
      position: absolute; left: 0; right: 0;
      background: var(--minimap-cur);
      border: 1px solid rgba(128,128,200,0.3);
      border-radius: 2px; pointer-events: none; transition: top 0.05s;
    }

    /* ── Placeholder ─────────────────────────────────────────────────────── */
    .placeholder {
      display: flex; align-items: center; justify-content: center;
      flex: 1; color: var(--ph-col); font-size: 1rem;
      text-align: center; padding: 40px;
    }

    .stats { font-size: 0.76rem; color: var(--stats-col); }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    footer {
      background: var(--bg2); border-top: 1px solid var(--border);
      padding: 5px 20px; font-size: 0.72rem; color: var(--text-dim);
      display: flex; justify-content: space-between; flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <h1>txt-div</h1>
  <label class="theme-toggle" id="themeToggle" title="Hell/Dunkel umschalten">
    <span id="themeIcon">☀️</span>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
    <span id="themeLabel">Light</span>
  </label>
</header>

<!-- Upload -->
<div class="upload-bar">
  <div class="upload-group">
    <label>Datei A (Original)</label>
    <div class="file-btn">
      <input type="file" id="fileA" accept="text/*">
      <span id="labelA">Datei auswählen…</span>
    </div>
  </div>
  <button class="swap-btn" id="swapBtn" title="Original und Vergleichsdatei tauschen" disabled>&#8644;</button>
  <div class="upload-group">
    <label>Datei B (Vergleich)</label>
    <div class="file-btn">
      <input type="file" id="fileB" accept="text/*">
      <span id="labelB">Datei auswählen…</span>
    </div>
  </div>
  <button class="compare-btn" id="compareBtn" disabled>Vergleichen</button>
</div>

<!-- Toolbar: Navigation + Auswahl-Modus + Legende -->
<div class="toolbar">
  <div class="nav-group">
    <button class="nav-btn" id="prevBtn" disabled title="Vorheriger Unterschied">&#8593; Zurück</button>
    <span class="nav-counter" id="navCounter">–</span>
    <button class="nav-btn" id="nextBtn" disabled title="Nächster Unterschied">Weiter &#8595;</button>
  </div>
  <label class="mode-toggle" id="modeToggle" title="Zwischen Zeilen- und Blockauswahl wechseln">
    <span>Auswahlmodus:</span>
    <span class="mode-opt" id="modeOptLine">Zeilenweise</span>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
    <span class="mode-opt" id="modeOptBlock">Blockweise</span>
  </label>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-added"></div> Hinzugefügt</div>
    <div class="legend-item"><div class="legend-dot dot-changed"></div> Geändert</div>
    <div class="legend-item"><div class="legend-dot dot-removed"></div> Entfernt</div>
  </div>
</div>

<!-- Diff-Bereich + Minimap -->
<div class="diff-wrapper">
  <div class="diff-container" id="diffContainer">
    <div class="placeholder">Zwei Textdateien auswählen und auf „Vergleichen" klicken</div>
  </div>
  <div class="minimap" id="minimap" style="display:none">
    <div class="minimap-track" id="minimapTrack"></div>
    <div class="minimap-viewport" id="minimapViewport"></div>
  </div>
</div>

<!-- Merge-Ergebnis -->
<div class="result-area" id="resultArea" style="display:none">
  <div class="result-toggle" id="resultToggle">
    <span class="result-chevron">▶</span>
    <span>Merge-Ergebnis</span>
    <span id="resultHint" style="margin-left:auto;font-size:0.75rem"></span>
  </div>
  <div class="result-panels">
    <div class="result-pane">
      <div class="result-pane-header">
        <span id="resultLabel">Ergebnis</span>
        <div class="result-actions">
          <button class="result-btn" id="copyBtn">Kopieren</button>
          <button class="result-btn" id="saveBtn">Speichern</button>
        </div>
      </div>
      <div class="result-content" id="resultContent"></div>
    </div>
  </div>
</div>

<script>
  // ── Theme ─────────────────────────────────────────────────────────────────
  const html = document.documentElement;

  function applyThemeUI(theme) {
    const isLight = theme === 'light';
    document.getElementById('themeIcon').textContent  = isLight ? '☀️' : '🌙';
    document.getElementById('themeLabel').textContent = isLight ? 'Light' : 'Dark';
  }

  // Toggle-Button sofort auf aktuelles (system-gesetztes) Theme anpassen
  applyThemeUI(html.dataset.theme);

  document.getElementById('themeToggle').addEventListener('click', () => {
    const light = html.dataset.theme !== 'light';
    html.dataset.theme = light ? 'light' : 'dark';
    applyThemeUI(html.dataset.theme);
    updateMinimapViewport();
  });

  // ── File loading ──────────────────────────────────────────────────────────
  const fileA = document.getElementById('fileA');
  const fileB = document.getElementById('fileB');
  const btn   = document.getElementById('compareBtn');
  let contentA = null, contentB = null;

  const swapBtn  = document.getElementById('swapBtn');
  const NO_FILE  = 'Datei auswählen…';

  function updateFileButtons() {
    btn.disabled     = !(contentA !== null && contentB !== null);
    swapBtn.disabled = contentA === null && contentB === null;
  }

  function readFile(input, labelEl, slot) {
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      labelEl.textContent = file.name;
      const reader = new FileReader();
      reader.onload = e => {
        if (slot === 'A') contentA = e.target.result;
        else              contentB = e.target.result;
        updateFileButtons();
      };
      reader.readAsText(file, 'UTF-8');
    });
  }

  readFile(fileA, document.getElementById('labelA'), 'A');
  readFile(fileB, document.getElementById('labelB'), 'B');

  // Original und Vergleichsdatei tauschen. Bereits getroffene A/B-Entschei-
  // dungen werden dabei verworfen: der LCS-Tie-Break ist nicht symmetrisch,
  // diffLines(B,A) kann also anders gruppieren als diffLines(A,B) — eine
  // Übernahme per Index würde Entscheidungen an falsche Zeilen hängen.
  swapBtn.addEventListener('click', () => {
    const la = document.getElementById('labelA');
    const lb = document.getElementById('labelB');
    [contentA, contentB]       = [contentB, contentA];
    [la.textContent, lb.textContent] = [lb.textContent, la.textContent];
    // Die File-Inputs selbst sind nicht beschreibbar; sie werden geleert,
    // damit ein erneutes Auswählen derselben Datei wieder ein change-Event
    // auslöst und nicht stumm bleibt.
    fileA.value = ''; fileB.value = '';
    updateFileButtons();
    if (contentA !== null && contentB !== null) compare(contentA, contentB);
  });
  btn.addEventListener('click', () => compare(contentA, contentB));

  // ── State ─────────────────────────────────────────────────────────────────
  let diffGroups  = [];
  let currentDiff = -1;
  // Scroll-Sync: Wer zuletzt gescrollt hat, behält für kurze Zeit die Kontrolle.
  // Ein einfaches Boolean reicht nicht — Scroll-Events feuern asynchron, das Flag
  // wäre beim Eintreffen des Echo-Events längst wieder zurückgesetzt.
  let scrollOwner     = null;
  let scrollOwnerTime = 0;
  const OWNER_HOLD_MS = 150;

  function claimScroll(name) {
    const now = performance.now();
    if (scrollOwner !== name && now - scrollOwnerTime < OWNER_HOLD_MS) return false;
    scrollOwner     = name;
    scrollOwnerTime = now;
    return true;
  }

  // Zuordnung zwischen Diff-Zeilen (op-Index) und Ergebnis-Zeilen
  let opToLine = [];
  let lineToOp = [];
  let paneObserver = null;
  let allOps      = [];
  let lineMode    = false;

  const prevBtn    = document.getElementById('prevBtn');
  const nextBtn    = document.getElementById('nextBtn');
  const navCounter = document.getElementById('navCounter');
  const modeToggle   = document.getElementById('modeToggle');
  const modeOptLine  = document.getElementById('modeOptLine');
  const modeOptBlock = document.getElementById('modeOptBlock');

  function applyModeUI() {
    // Thumb zeigt zur aktiven Seite: links = Zeilenweise, rechts = Blockweise
    modeToggle.classList.toggle('on', !lineMode);
    modeOptLine.classList.toggle('active', lineMode);
    modeOptBlock.classList.toggle('active', !lineMode);
  }

  applyModeUI();

  modeToggle.addEventListener('click', () => {
    lineMode = !lineMode;
    applyModeUI();
  });

  prevBtn.addEventListener('click', () => jumpTo(currentDiff - 1));
  nextBtn.addEventListener('click', () => jumpTo(currentDiff + 1));

  function jumpTo(idx) {
    if (!diffGroups.length) return;
    idx = Math.max(0, Math.min(diffGroups.length - 1, idx));
    currentDiff = idx;

    document.querySelectorAll('.current-diff').forEach(el => el.classList.remove('current-diff'));

    const rowIdx = diffGroups[idx].rowIndex;
    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');
    if (!sa) return;

    if (sa.children[rowIdx]) sa.children[rowIdx].classList.add('current-diff');
    if (sb.children[rowIdx]) sb.children[rowIdx].classList.add('current-diff');

    const el = sa.children[rowIdx];
    if (el) {
      const target = Math.max(0, el.offsetTop - sa.clientHeight * 0.2);
      claimScroll('nav');
      sa.scrollTop = target;
      sb.scrollTop = target;
      updateMinimapViewport();
      syncDiffToResult(sa);
    }

    updateNavUI();
  }

  function updateNavUI() {
    navCounter.textContent = diffGroups.length
      ? `${currentDiff + 1} / ${diffGroups.length}`
      : '–';
    prevBtn.disabled = currentDiff <= 0;
    nextBtn.disabled = currentDiff >= diffGroups.length - 1;
  }

  // ── Zeilenhöhen der beiden Panes angleichen ──────────────────────────────
  // Bricht eine Zeile auf mehrere Bildschirmzeilen um, muss die Gegenzeile
  // denselben Platz einnehmen — sonst laufen die Spalten auseinander.
  // Betrifft Leerzeilen ohne Gegenstück ebenso wie geänderte Zeilen
  // unterschiedlicher Länge.
  function alignRowHeights() {
    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');
    if (!sa || !sb) return;
    const rowsA = sa.children, rowsB = sb.children;
    const n = Math.min(rowsA.length, rowsB.length);

    // Erst alle Overrides lösen, damit die natürliche Höhe messbar ist …
    for (let i = 0; i < n; i++) {
      rowsA[i].style.height = '';
      rowsB[i].style.height = '';
    }
    // … dann in einem Durchgang messen …
    const heights = new Array(n);
    for (let i = 0; i < n; i++) {
      heights[i] = Math.max(rowsA[i].offsetHeight, rowsB[i].offsetHeight);
    }
    // … und erst danach schreiben (hält es bei 2 Reflows statt 2n).
    for (let i = 0; i < n; i++) {
      rowsA[i].style.height = heights[i] + 'px';
      rowsB[i].style.height = heights[i] + 'px';
    }
  }

  // Breitenänderung ⇒ andere Umbruchpunkte ⇒ neu ausrichten
  let alignPending = false;
  function scheduleAlign() {
    if (alignPending) return;
    alignPending = true;
    requestAnimationFrame(() => {
      alignPending = false;
      alignRowHeights();
      const sa = document.getElementById('scrollA');
      if (sa) { claimScroll('nav'); syncDiffToResult(sa); }
      updateMinimapViewport();
    });
  }

  // ── Scroll-Sync Diff ↔ Ergebnis (zeilengenau über opToLine/lineToOp) ─────
  function resultOpen() {
    const ra = document.getElementById('resultArea');
    return ra && ra.classList.contains('open');
  }

  // Index der Zeile, die bei Scroll-Position y oben steht (Binärsuche)
  function findRowAt(container, y) {
    const rows = container.children;
    if (!rows.length) return 0;
    let lo = 0, hi = rows.length - 1, best = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (rows[mid].offsetTop <= y) { best = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return best;
  }

  function syncDiffToResult(source) {
    const rc = document.getElementById('resultContent');
    if (!rc || !resultOpen() || !rc.children.length) return;
    const i      = findRowAt(source, source.scrollTop);
    const offset = source.scrollTop - source.children[i].offsetTop;
    const target = rc.children[Math.min(rc.children.length - 1, opToLine[i] ?? 0)];
    if (target) rc.scrollTop = Math.max(0, target.offsetTop + offset);
  }

  function syncResultToDiff(rc) {
    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');
    if (!sa || !rc.children.length) return;
    const li     = findRowAt(rc, rc.scrollTop);
    const offset = rc.scrollTop - rc.children[li].offsetTop;
    const rowA   = sa.children[Math.min(sa.children.length - 1, lineToOp[li] ?? 0)];
    if (!rowA) return;
    const target = Math.max(0, rowA.offsetTop + offset);
    sa.scrollTop = target;
    sb.scrollTop = target;
    updateMinimapViewport();
  }

  // ── Minimap ───────────────────────────────────────────────────────────────
  const minimapEl    = document.getElementById('minimap');
  const minimapTrack = document.getElementById('minimapTrack');
  const minimapVP    = document.getElementById('minimapViewport');

  function buildMinimap(ops, totalRows) {
    minimapTrack.innerHTML = '';
    if (!totalRows) return;
    const mapH = minimapEl.clientHeight || 400;
    const segH = Math.max(2, mapH / totalRows);
    ops.forEach((op, i) => {
      if (op.type === 'equal') return;
      const seg = document.createElement('div');
      seg.className = `minimap-seg ${op.type}`;
      seg.style.top    = `${(i / totalRows) * mapH}px`;
      seg.style.height = `${segH}px`;
      minimapTrack.appendChild(seg);
    });
  }

  function updateMinimapViewport() {
    const sa = document.getElementById('scrollA');
    if (!sa || minimapEl.style.display === 'none') return;
    const mapH   = minimapEl.clientHeight;
    const totalH = sa.scrollHeight;
    const viewH  = sa.clientHeight;
    minimapVP.style.top    = `${(sa.scrollTop / totalH) * mapH}px`;
    minimapVP.style.height = `${Math.max(4, (viewH / totalH) * mapH)}px`;
  }

  minimapEl.addEventListener('click', e => {
    const sa = document.getElementById('scrollA');
    if (!sa) return;
    const rect  = minimapEl.getBoundingClientRect();
    const ratio = (e.clientY - rect.top) / minimapEl.clientHeight;
    sa.scrollTop = ratio * sa.scrollHeight;
  });

  // ── LCS ───────────────────────────────────────────────────────────────────
  function lcs(a, b) {
    const m = a.length, n = b.length;
    if (m * n > 4_000_000) return fastLcs(a, b);
    const dp = Array.from({length: m + 1}, () => new Uint16Array(n + 1));
    for (let i = m - 1; i >= 0; i--)
      for (let j = n - 1; j >= 0; j--)
        dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1
                                  : Math.max(dp[i+1][j], dp[i][j+1]);
    const seq = [];
    let i = 0, j = 0;
    while (i < m && j < n) {
      if (a[i] === b[j]) { seq.push([i, j]); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) i++;
      else j++;
    }
    return seq;
  }

  function fastLcs(a, b) {
    const bMap = new Map();
    b.forEach((v, i) => { if (!bMap.has(v)) bMap.set(v, i); });
    const seq = [];
    let jMin = 0;
    for (let i = 0; i < a.length; i++) {
      const j = bMap.get(a[i]);
      if (j !== undefined && j >= jMin) { seq.push([i, j]); jMin = j + 1; }
    }
    return seq;
  }

  function diffLines(linesA, linesB) {
    const common = lcs(linesA, linesB);
    const ops = [];
    let ia = 0, ib = 0, ci = 0;
    while (ci < common.length || ia < linesA.length || ib < linesB.length) {
      const ca = ci < common.length ? common[ci][0] : linesA.length;
      const cb = ci < common.length ? common[ci][1] : linesB.length;
      const removedBlock = linesA.slice(ia, ca);
      const addedBlock   = linesB.slice(ib, cb);
      const maxLen = Math.max(removedBlock.length, addedBlock.length);
      for (let k = 0; k < maxLen; k++) {
        if (k < removedBlock.length && k < addedBlock.length)
          ops.push({type: 'changed', textA: removedBlock[k], textB: addedBlock[k]});
        else if (k < removedBlock.length)
          ops.push({type: 'removed', textA: removedBlock[k], textB: null});
        else
          ops.push({type: 'added',   textA: null, textB: addedBlock[k]});
      }
      if (ci < common.length) {
        ops.push({type: 'equal', textA: linesA[ca], textB: linesB[cb]});
        ia = ca + 1; ib = cb + 1; ci++;
      } else {
        ia = linesA.length; ib = linesB.length;
      }
    }
    return ops;
  }

  function charDiff(a, b) {
    if (a === b) return [escHtml(a), escHtml(b)];
    const oa = [], ob = [];
    const common = lcs([...a], [...b]);
    let ia = 0, ib = 0, ci = 0;
    function flush(arrA, arrB, ca, cb) {
      const ra = a.slice(ia, ca), rb = b.slice(ib, cb);
      if (ra) arrA.push(`<mark class="changed">${escHtml(ra)}</mark>`);
      if (rb) arrB.push(`<mark class="changed">${escHtml(rb)}</mark>`);
    }
    while (ci <= common.length) {
      const ca = ci < common.length ? common[ci][0] : a.length;
      const cb = ci < common.length ? common[ci][1] : b.length;
      flush(oa, ob, ca, cb);
      if (ci < common.length) {
        const ch = escHtml(a[ca]);
        oa.push(ch); ob.push(ch);
        ia = ca + 1; ib = cb + 1;
      }
      ci++;
    }
    return [oa.join(''), ob.join('')];
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Merge helpers ─────────────────────────────────────────────────────────
  function setChoice(opIdx, choice) {
    const op = allOps[opIdx];
    if (!op || op.type === 'equal') return;
    op.choice = op.choice === choice ? null : choice;
    if (!lineMode) {
      allOps.forEach((o, i) => {
        if (i !== opIdx && o.groupIdx === op.groupIdx && o.type !== 'equal')
          o.choice = op.choice;
      });
    }
    updateMergeHighlights();
  }

  function computeResult() {
    const lines   = [];
    const diffIdx = new Set(); // alle Zeilen aus Diff-Positionen → hellblau
    opToLine = [];
    lineToOp = [];

    allOps.forEach((op, oi) => {
      // Ops ohne eigene Ergebnis-Zeile zeigen auf die nächste erzeugte Zeile
      opToLine[oi] = lines.length;
      let text = null;
      if (op.type === 'equal')      text = op.textA;
      else if (op.choice === 'B')   text = op.textB;
      else                          text = op.textA;   // null oder 'A'
      if (text === null) return;
      if (op.type !== 'equal') diffIdx.add(lines.length);
      lineToOp[lines.length] = oi;
      lines.push(text);
    });

    return { text: lines.join('\n'), lines, diffIdx };
  }

  function renderResult() {
    const nameA = document.getElementById('labelA').textContent;
    document.getElementById('resultLabel').textContent = `Ergebnis (Basis: ${nameA})`;

    const r = computeResult();
    document.getElementById('resultContent').innerHTML = r.lines.map((l, i) =>
      `<div class="line${r.diffIdx.has(i) ? ' diff-line' : ''}"><span class="line-num">${i + 1}</span><span class="line-text">${escHtml(l)}</span></div>`
    ).join('');

    // Nach dem Neuaufbau ist scrollTop 0 — Position aus den Diff-Panes
    // wiederherstellen. claimScroll verhindert, dass das dabei entstehende
    // Scroll-Event die Diff-Panes nach oben zieht.
    const sa = document.getElementById('scrollA');
    if (sa) { claimScroll('nav'); syncDiffToResult(sa); }

    const countB    = allOps.filter(o => o.choice === 'B').length;
    const countA    = allOps.filter(o => o.choice === 'A').length;
    const countOpen = allOps.filter(o => o.type !== 'equal' && o.choice === null).length;
    const parts = [];
    if (countB)    parts.push(`${countB}× B`);
    if (countA)    parts.push(`${countA}× A`);
    if (countOpen) parts.push(`${countOpen} offen`);
    document.getElementById('resultHint').textContent = parts.join(' · ') || '–';
  }

  function updateMergeHighlights() {
    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');
    if (!sa || !sb) return;

    // Pfeile stehen jetzt in beiden Panes
    document.querySelectorAll('.pane-content .merge-btn').forEach(btn => {
      const op = allOps[parseInt(btn.dataset.op)];
      if (!op) return;
      btn.classList.toggle('active', op.choice === btn.dataset.choice);
    });

    // Die jeweils gewählte Zeile markieren
    for (let i = 0; i < allOps.length; i++) {
      const choice = allOps[i].choice;
      const rowA = sa.children[i];
      const rowB = sb.children[i];
      if (rowA) rowA.classList.toggle('chosen', choice === 'A');
      if (rowB) rowB.classList.toggle('chosen', choice === 'B');
    }

    renderResult();
  }

  // ── Result Area ───────────────────────────────────────────────────────────
  document.getElementById('resultToggle').addEventListener('click', () => {
    document.getElementById('resultArea').classList.toggle('open');
    // Scroll-Position sofort angleichen wenn Panel geöffnet wird
    const sa = document.getElementById('scrollA');
    if (sa) { claimScroll('nav'); syncDiffToResult(sa); }
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(computeResult().text);
  });

  function downloadText(text, filename) {
    const blob = new Blob([text], {type: 'text/plain'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const name = document.getElementById('labelA').textContent;
    downloadText(computeResult().text,
      name !== 'Datei auswählen…' ? 'merged_' + name : 'ergebnis.txt');
  });

  // ── Render ────────────────────────────────────────────────────────────────
  function compare(textA, textB) {
    const linesA = textA.split('\n');
    const linesB = textB.split('\n');
    const ops    = diffLines(linesA, linesB);
    allOps = ops;

    let numA = 0, numB = 0;
    const stats     = {added: 0, removed: 0, changed: 0};
    const leftRows  = [];
    const rightRows = [];
    const newGroups = [];
    let inDiffGroup = false;
    let groupIdx    = -1;

    // Leere Merge-Cell für rechte Pane (gleiche Breite wie links → identische Textbreite)
    const emptyCell = `<span class="merge-cell"></span>`;

    for (let i = 0; i < ops.length; i++) {
      const op = ops[i];
      op.choice = null;

      if (op.type !== 'equal' && !inDiffGroup) {
        groupIdx++;
        newGroups.push({rowIndex: i, type: op.type});
        inDiffGroup = true;
      }
      if (op.type === 'equal') inDiffGroup = false;
      op.groupIdx = op.type !== 'equal' ? groupIdx : -1;

      // Pfeil in A zeigt nach rechts, Pfeil in B nach links: beide weisen zur
      // Gegenseite und bedeuten „diese Version gilt".
      const cellA = op.type !== 'equal'
        ? `<span class="merge-cell"><button class="merge-btn" data-op="${i}" data-choice="A" title="A-Version übernehmen">&#8594;</button></span>`
        : emptyCell;
      const cellB = op.type !== 'equal'
        ? `<span class="merge-cell"><button class="merge-btn" data-op="${i}" data-choice="B" title="B-Version übernehmen">&#8592;</button></span>`
        : emptyCell;

      if (op.type === 'equal') {
        numA++; numB++;
        const t = escHtml(op.textA);
        leftRows.push (`<div class="line"><span class="line-num">${numA}</span><span class="line-text">${t}</span>${emptyCell}</div>`);
        rightRows.push(`<div class="line"><span class="line-num">${numB}</span>${emptyCell}<span class="line-text">${t}</span></div>`);
      } else if (op.type === 'changed') {
        numA++; numB++; stats.changed++;
        const [hA, hB] = charDiff(op.textA, op.textB);
        leftRows.push (`<div class="line changed"><span class="line-num">${numA}</span><span class="line-text">${hA}</span>${cellA}</div>`);
        rightRows.push(`<div class="line changed"><span class="line-num">${numB}</span>${cellB}<span class="line-text">${hB}</span></div>`);
      } else if (op.type === 'removed') {
        numA++; stats.removed++;
        leftRows.push (`<div class="line removed"><span class="line-num">${numA}</span><span class="line-text">${escHtml(op.textA)}</span>${cellA}</div>`);
        rightRows.push(`<div class="line empty"><span class="line-num"> </span>${cellB}<span class="line-text"> </span></div>`);
      } else {
        numB++; stats.added++;
        leftRows.push (`<div class="line empty"><span class="line-num"> </span><span class="line-text"> </span>${cellA}</div>`);
        rightRows.push(`<div class="line added"><span class="line-num">${numB}</span>${cellB}<span class="line-text">${escHtml(op.textB)}</span></div>`);
      }
    }

    diffGroups  = newGroups;
    currentDiff = diffGroups.length ? 0 : -1;

    const nameA     = document.getElementById('labelA').textContent;
    const nameB     = document.getElementById('labelB').textContent;
    const statsHtml = `<span class="stats">+${stats.added} &nbsp;~${stats.changed} &nbsp;-${stats.removed}</span>`;

    document.getElementById('diffContainer').innerHTML = `
      <div class="diff-pane">
        <div class="pane-header"><span>A: ${escHtml(nameA)}</span>${statsHtml}</div>
        <div class="pane-content" id="scrollA">${leftRows.join('')}</div>
      </div>
      <div class="diff-pane">
        <div class="pane-header"><span>B: ${escHtml(nameB)}</span></div>
        <div class="pane-content" id="scrollB">${rightRows.join('')}</div>
      </div>`;

    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');

    // Höhen angleichen, bevor irgendetwas offsetTop ausliest
    alignRowHeights();

    // Bei Breitenänderung ändern sich die Umbruchpunkte
    if (paneObserver) paneObserver.disconnect();
    paneObserver = new ResizeObserver(scheduleAlign);
    paneObserver.observe(sa);

    sa.addEventListener('scroll', () => {
      if (!claimScroll('A')) return;
      sb.scrollTop = sa.scrollTop;
      updateMinimapViewport();
      syncDiffToResult(sa);
    });

    sb.addEventListener('scroll', () => {
      if (!claimScroll('B')) return;
      sa.scrollTop = sb.scrollTop;
      updateMinimapViewport();
      syncDiffToResult(sb);
    });

    // Scroll vom Merge-Ergebnis zurück auf die Diff-Panes
    const rc = document.getElementById('resultContent');
    rc.addEventListener('scroll', () => {
      if (!claimScroll('R')) return;
      syncResultToDiff(rc);
    });

    // Pfeile sitzen in beiden Panes, daher beide Panes abhören
    const onMergeClick = e => {
      const mbtn = e.target.closest('.merge-btn');
      if (!mbtn) return;
      setChoice(parseInt(mbtn.dataset.op), mbtn.dataset.choice);
    };
    sa.addEventListener('click', onMergeClick);
    sb.addEventListener('click', onMergeClick);

    minimapEl.style.display = 'block';
    buildMinimap(ops, ops.length);
    updateMinimapViewport();
    sa.addEventListener('scroll', updateMinimapViewport);

    prevBtn.disabled = false;
    nextBtn.disabled = false;
    updateNavUI();
    if (diffGroups.length) jumpTo(0);

    document.getElementById('resultArea').style.display = '';
    renderResult();
  }
</script>

<footer>
  <span>thought up by human, created by ai</span>
  <span>v0.5.3</span>
</footer>
</body>
