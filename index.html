<!-- thought up by human, created by ai -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none';">
  <title>txt-div</title>
  <script>
    // Apply the system theme before the first paint to avoid a flash.
    document.documentElement.dataset.theme =
      window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
  <style>
    /* ── CSS custom properties: dark / light ─────────────────────────────── */
    :root {
      --bg:          #1a1a2e;
      --bg2:         #16213e;
      --bg3:         #111827;
      --border:      #0f3460;
      --border2:     #1f2937;
      --accent:      #23a96a;
      --accent-h:    #075033;
      --btn-bg:      #0f3460;
      --btn-bg-h:    #1a4a80;
      --text:        #e0e0e0;
      --text-dim:    #a0a0b0;
      --text-num:    #555;
      --text-hdr:    #a0c0e0;
      --stats-col:   #888;
      --ph-col:      #444;
      --line-border: rgba(255,255,255,0.03);
      --empty-bg:    rgba(255,255,255,0.02);
      --minimap-bg:  #0d1525;
      --minimap-cur: rgba(255,255,255,0.12);
      --nav-bg:      #16213e;
      --switch:      #23a96a;   /* toggle switch thumb, identical in both themes */
      --error:       #ff8f8f;   /* light enough for 4.5:1 on --btn-bg */
    }
    [data-theme="light"] {
      --bg:          #f5f5f5;
      --bg2:         #ffffff;
      --bg3:         #e8eaf0;
      --border:      #c5cde0;
      --border2:     #d8dce8;
      --accent:      #23a96a;
      --accent-h:    #075033;
      --btn-bg:      #dde3f0;
      --btn-bg-h:    #c5cde0;
      --text:        #1a1a2e;
      --text-dim:    #555577;
      --text-num:    #9090a0;
      --text-hdr:    #334466;
      --stats-col:   #667788;
      --ph-col:      #aaa;
      --line-border: rgba(0,0,0,0.04);
      --empty-bg:    rgba(0,0,0,0.02);
      --minimap-bg:  #e0e4ef;
      --minimap-cur: rgba(0,0,0,0.12);
      --nav-bg:      #eef0f8;
      --error:       #b3261e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      background: var(--bg2);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      flex: 1;
    }

    /* ── Toggle switches (theme, selection mode) ─────────────────────────── */
    .theme-toggle,
    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }

    .toggle-track {
      width: 36px; height: 20px;
      border-radius: 10px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--switch);
      transition: transform 0.2s;
    }

    /* Scoped to .theme-toggle, otherwise the mode switch would slide along in
       the light theme. The mode switch is driven by .on instead. */
    [data-theme="light"] .theme-toggle .toggle-thumb { transform: translateX(16px); }

    /* The mode switch is labelled on both sides: thumb left = per line (left
       label), thumb right = per block. So .on means per block, not lineMode. */
    .mode-toggle.on .toggle-thumb { transform: translateX(16px); }

    .mode-opt { transition: color 0.2s; }

    .mode-opt.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* ── Upload bar ──────────────────────────────────────────────────────── */
    .upload-bar {
      background: var(--bg2);
      padding: 12px 20px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 200px;
    }

    .upload-group label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* block so the field fills the whole group width — otherwise slack would
       remain to its right and the swap button would sit next to file B. */
    .file-btn { position: relative; display: block; }

    .file-btn input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer; width: 100%;
    }

    .file-face {
      display: flex; align-items: baseline; gap: 8px;
      padding: 7px 14px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
      overflow: hidden;
      color: var(--text);
    }

    .file-btn:hover .file-face { background: var(--btn-bg-h); }

    /* When space runs short the metadata gives way almost alone (very high
       flex-shrink) and gets clipped, so the name stays complete as long as it
       fits at all. Only then does the name shrink too. No max-width on the
       name — combined with the gap that would overflow once the metadata has
       shrunk to zero. */
    .file-name {
      flex: 0 1 auto; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .file-meta {
      flex: 0 9999 auto; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text-dim); font-size: 0.76rem;
    }

    /* Read errors are surfaced in place of the metadata. */
    .file-meta.error { color: var(--error); font-style: italic; }

    .compare-btn {
      padding: 8px 22px;
      background: var(--accent);
      border: none; border-radius: 6px;
      color: white; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }

    .compare-btn:hover { background: var(--accent-h); }
    .compare-btn:disabled { background: var(--btn-bg); color: var(--text-dim); cursor: not-allowed; }

    /* Swap button between the two file pickers */
    .swap-btn {
      padding: 6px 12px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1.05rem; line-height: 1.25;
      cursor: pointer; transition: background 0.2s;
      flex-shrink: 0;
    }

    .swap-btn:hover:not(:disabled) { background: var(--btn-bg-h); }
    .swap-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Nav + legend bar ────────────────────────────────────────────────── */
    .toolbar {
      background: var(--nav-bg);
      padding: 7px 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .nav-group { display: flex; align-items: center; gap: 6px; }

    .nav-btn {
      padding: 4px 12px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text); font-size: 0.82rem;
      cursor: pointer; transition: background 0.15s; line-height: 1.4;
    }

    .nav-btn:hover { background: var(--btn-bg-h); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .nav-counter {
      font-size: 0.8rem; color: var(--text-dim);
      min-width: 60px; text-align: center;
    }

    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; }

    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: var(--text-dim);
    }

    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    .dot-added   { background: rgba(50,180,80,.6);  border: 1px solid #32b450; }
    .dot-changed { background: rgba(220,140,30,.6); border: 1px solid #dc8c1e; }
    .dot-removed { background: rgba(220,60,60,.6);  border: 1px solid #dc3c3c; }

    /* Warning strip above the panes, e.g. when the approximation is in use */
    .notice {
      flex-shrink: 0;
      padding: 6px 16px;
      background: rgba(220,140,30,.18);
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .notice[hidden] { display: none; }

    /* ── Main layout ─────────────────────────────────────────────────────── */
    .diff-wrapper {
      display: flex; flex: 1; overflow: hidden; min-height: 0;
    }

    .diff-container { display: flex; flex: 1; overflow: hidden; }

    .diff-pane {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; border-right: 1px solid var(--border);
    }

    .diff-pane:last-child { border-right: none; }

    .pane-header {
      padding: 6px 14px;
      background: var(--btn-bg);
      font-size: 0.78rem; color: var(--text-hdr);
      font-weight: 600; letter-spacing: 0.04em;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    /* position: relative makes the container the offsetParent of its rows —
       only then is row.offsetTop directly usable as scrollTop. */
    .pane-content {
      overflow: auto; flex: 1; position: relative;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.84rem; line-height: 1.6;
      /* Overlay scrollbars (macOS) paint over the content and would otherwise
         hide the arrows at the right edge of pane A while shown. The strip is
         reserved in both panes so the text columns stay equally wide and rows
         keep lining up 1:1. scrollbar-gutter alone is not enough — it has no
         effect on overlay scrollbars. */
      padding-right: 14px;
    }

    /* Every row holds the same three parts in both panes, only mirrored —
       pane A: line-num | line-text | merge-cell, pane B: line-num |
       merge-cell | line-text. Since the merge-cell has the same width in both
       panes, the text column stays equally wide, so rows wrap at the same
       points and line up 1:1. */
    .line {
      display: flex; min-height: 1.6em;
      border-bottom: 1px solid var(--line-border);
    }

    /* Frame around the current navigation target. An outline would box each
       row separately; per-edge inset shadows instead produce one continuous
       frame even when the target spans several rows. */
    .line.current-diff {
      z-index: 1; position: relative;
      --edge-l: inset  2px 0 0 var(--accent);
      --edge-r: inset -2px 0 0 var(--accent);
      --edge-t: inset 0  2px 0 var(--accent);
      --edge-b: inset 0 -2px 0 var(--accent);
    }

    .line.current-diff.nav-single { box-shadow: var(--edge-l), var(--edge-r), var(--edge-t), var(--edge-b); }
    .line.current-diff.nav-first  { box-shadow: var(--edge-l), var(--edge-r), var(--edge-t); }
    .line.current-diff.nav-mid    { box-shadow: var(--edge-l), var(--edge-r); }
    .line.current-diff.nav-last   { box-shadow: var(--edge-l), var(--edge-r), var(--edge-b); }

    .line-num {
      min-width: 44px; padding: 0 8px; text-align: right;
      color: var(--text-num); background: var(--bg3);
      user-select: none; border-right: 1px solid var(--border2);
      font-size: 0.76rem; line-height: 1.6; flex-shrink: 0;
    }

    /* Prefer breaking at spaces; only a single overlong word is split mid-way.
       min-width: 0 lets the flex child shrink so wrapping takes effect. */
    .line-text {
      padding: 0 12px; white-space: pre-wrap;
      overflow-wrap: anywhere; word-break: normal;
      flex: 1; min-width: 0;
    }

    .line.added   .line-text { background: rgba(50,180,80,.15); }
    .line.removed .line-text { background: rgba(220,60,60,.15); }
    .line.changed .line-text { background: rgba(220,140,30,.15); }
    .line.empty   .line-text { background: var(--empty-bg); color: transparent; }

    mark.added   { background: rgba(50,180,80,.5);  border-radius: 2px; color: inherit; }
    mark.removed { background: rgba(220,60,60,.5);  border-radius: 2px; color: inherit; }
    mark.changed { background: rgba(220,140,30,.5); border-radius: 2px; color: inherit; }

    /* ── Merge arrows ────────────────────────────────────────────────────────
       One arrow per side, both facing the centre line: in pane A behind the
       text, in pane B before it. Both panes keep exactly one merge-cell of
       equal width so the text columns stay equally wide and rows wrap at the
       same points. */
    .merge-cell {
      width: 26px; flex-shrink: 0;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 1px 3px 0;
    }

    .merge-btn {
      width: 20px; height: 20px;
      border: 1px solid var(--border); border-radius: 3px;
      background: var(--btn-bg); color: var(--text-dim);
      font-size: 0.8rem;
      cursor: pointer; padding: 0; line-height: 1;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: flex; align-items: center; justify-content: center;
    }

    .merge-btn:hover { background: var(--btn-bg-h); color: var(--text); }

    /* Chosen side — one shared selection colour, since the side is already
       conveyed by the arrow's position. */
    .merge-btn.active {
      background: rgba(50,150,255,0.3);
      border-color: #3296ff;
      color: #2b7fd4;
    }

    [data-theme="dark"] .merge-btn.active { color: #80c0ff; }

    .line.chosen .line-text {
      outline: 1px dashed rgba(50,150,255,0.6);
      outline-offset: -1px;
    }

    /* ── Result area ─────────────────────────────────────────────────────── */
    .result-area {
      flex-shrink: 0; border-top: 2px solid var(--border);
    }

    /* Grip on the top edge — the panel is docked at the bottom, so dragging
       up enlarges it. Only usable while expanded. */
    .result-resizer {
      display: none;
      height: 6px; cursor: row-resize;
      background: var(--nav-bg);
      transition: background 0.15s;
    }

    .result-area.open .result-resizer { display: block; }

    .result-resizer:hover,
    .result-resizer.dragging { background: var(--accent); }

    .result-toggle {
      padding: 6px 16px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      font-size: 0.82rem; color: var(--text-dim);
      background: var(--nav-bg); border-bottom: 1px solid transparent;
    }

    .result-toggle:hover { color: var(--text); }

    .result-chevron { display: inline-block; transition: transform 0.18s; }

    .result-area.open .result-chevron { transform: rotate(90deg); }
    .result-area.open .result-toggle  { border-bottom-color: var(--border); }

    .result-panels { display: none; height: 250px; }
    .result-area.open .result-panels { display: flex; }

    .result-pane {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }

    .result-pane-header {
      padding: 5px 12px; background: var(--btn-bg);
      font-size: 0.78rem; color: var(--text-hdr); font-weight: 600;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; gap: 8px;
    }

    .result-actions { display: flex; gap: 5px; }

    .result-btn {
      padding: 2px 9px; background: var(--btn-bg);
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-size: 0.75rem;
      cursor: pointer; transition: background 0.15s;
    }

    .result-btn:hover { background: var(--btn-bg-h); }

    .result-content {
      overflow: auto; flex: 1; position: relative;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.84rem; line-height: 1.6;
    }

    /* Every row originating from a diff position is light blue, no matter
       whether A or B was chosen. */
    .line.diff-line .line-text { background: rgba(50,150,255,0.18); }

    /* Marker for rows omitted from the result. Red as in the "removed" legend;
       flatter than a text row since it is only a hint. */
    .line.gap-line { min-height: 0; }

    .line.gap-line .line-num {
      color: rgba(220,60,60,.75);
      background: var(--bg3);
    }

    .line.gap-line .line-text {
      background: repeating-linear-gradient(
        -45deg,
        rgba(220,60,60,.13) 0 6px,
        rgba(220,60,60,.05) 6px 12px);
      color: var(--text-dim);
      font-size: 0.72rem;
      font-style: italic;
      line-height: 1.5;
    }

    /* ── Minimap ─────────────────────────────────────────────────────────── */
    .minimap {
      width: 20px; background: var(--minimap-bg);
      border-left: 1px solid var(--border);
      position: relative; flex-shrink: 0; cursor: pointer; overflow: hidden;
    }

    .minimap-track { position: absolute; inset: 0; }

    .minimap-seg {
      position: absolute; left: 2px; right: 2px;
      border-radius: 2px; min-height: 2px;
    }

    .minimap-seg.added   { background: rgba(50,180,80,.75); }
    .minimap-seg.changed { background: rgba(220,140,30,.75); }
    .minimap-seg.removed { background: rgba(220,60,60,.75); }

    .minimap-viewport {
      position: absolute; left: 0; right: 0;
      background: var(--minimap-cur);
      border: 1px solid rgba(128,128,200,0.3);
      border-radius: 2px; pointer-events: none; transition: top 0.05s;
    }

    /* ── Placeholder ─────────────────────────────────────────────────────── */
    .placeholder {
      display: flex; align-items: center; justify-content: center;
      flex: 1; color: var(--ph-col); font-size: 1rem;
      text-align: center; padding: 40px;
    }

    .placeholder.error { color: var(--error); }

    .stats { font-size: 0.76rem; color: var(--stats-col); }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    footer {
      background: var(--bg2); border-top: 1px solid var(--border);
      padding: 5px 20px; font-size: 0.72rem; color: var(--text-dim);
      display: flex; justify-content: space-between; flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <h1>txt-div</h1>
  <label class="theme-toggle" id="themeToggle" title="Hell/Dunkel umschalten">
    <span id="themeIcon">☀️</span>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
    <span id="themeLabel">Light</span>
  </label>
</header>

<!-- File pickers -->
<div class="upload-bar">
  <div class="upload-group">
    <label>Datei A (Original)</label>
    <div class="file-btn">
      <input type="file" id="fileA" accept="text/*">
      <span class="file-face">
        <span class="file-name" id="labelA">Datei wählen oder hierher ziehen…</span>
        <span class="file-meta" id="metaA"></span>
      </span>
    </div>
  </div>
  <button class="swap-btn" id="swapBtn" title="Original und Vergleichsdatei tauschen" disabled>&#8644;</button>
  <div class="upload-group">
    <label>Datei B (Vergleich)</label>
    <div class="file-btn">
      <input type="file" id="fileB" accept="text/*">
      <span class="file-face">
        <span class="file-name" id="labelB">Datei wählen oder hierher ziehen…</span>
        <span class="file-meta" id="metaB"></span>
      </span>
    </div>
  </div>
  <button class="compare-btn" id="compareBtn" disabled>Vergleichen</button>
</div>

<!-- Toolbar: navigation, selection mode, legend -->
<div class="toolbar">
  <div class="nav-group">
    <button class="nav-btn" id="prevBtn" disabled title="Vorheriger Unterschied">&#8593; Zurück</button>
    <span class="nav-counter" id="navCounter">–</span>
    <button class="nav-btn" id="nextBtn" disabled title="Nächster Unterschied">Weiter &#8595;</button>
  </div>
  <label class="mode-toggle" id="modeToggle" title="Zwischen Zeilen- und Blockauswahl wechseln">
    <span>Auswahlmodus:</span>
    <span class="mode-opt" id="modeOptLine">Zeilenweise</span>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
    <span class="mode-opt" id="modeOptBlock">Blockweise</span>
  </label>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-added"></div> Hinzugefügt</div>
    <div class="legend-item"><div class="legend-dot dot-changed"></div> Geändert</div>
    <div class="legend-item"><div class="legend-dot dot-removed"></div> Entfernt</div>
  </div>
</div>

<!-- Shown when the comparison falls back to the approximation -->
<div class="notice" id="notice" hidden></div>

<!-- Diff panes and minimap -->
<div class="diff-wrapper">
  <div class="diff-container" id="diffContainer">
    <div class="placeholder">Zwei Textdateien auswählen und auf „Vergleichen" klicken</div>
  </div>
  <div class="minimap" id="minimap" style="display:none">
    <div class="minimap-track" id="minimapTrack"></div>
    <div class="minimap-viewport" id="minimapViewport"></div>
  </div>
</div>

<!-- Merge result -->
<div class="result-area" id="resultArea" style="display:none">
  <div class="result-resizer" id="resultResizer" title="Höhe des Merge-Bereichs ziehen"></div>
  <div class="result-toggle" id="resultToggle">
    <span class="result-chevron">▶</span>
    <span>Merge-Ergebnis</span>
    <span id="resultHint" style="margin-left:auto;font-size:0.75rem"></span>
  </div>
  <div class="result-panels">
    <div class="result-pane">
      <div class="result-pane-header">
        <span id="resultLabel">Ergebnis</span>
        <div class="result-actions">
          <button class="result-btn" id="copyBtn">Kopieren</button>
          <button class="result-btn" id="saveBtn">Speichern</button>
        </div>
      </div>
      <div class="result-content" id="resultContent"></div>
    </div>
  </div>
</div>

<footer>
  <span>thought up by human, created by ai</span>
  <span id="appVersion"></span>
</footer>

<script>
  // ── Version ───────────────────────────────────────────────────────────────
  // Single source of truth for the version; keep in sync with releases.md.
  // Every other place (footer, future cache busting) derives from this.
  const APP_VERSION = '0.11.0';

  // ── Theme ─────────────────────────────────────────────────────────────────
  const html = document.documentElement;

  function applyThemeUI(theme) {
    const isLight = theme === 'light';
    document.getElementById('themeIcon').textContent  = isLight ? '☀️' : '🌙';
    document.getElementById('themeLabel').textContent = isLight ? 'Light' : 'Dark';
  }

  // Sync the toggle with the theme the inline head script already applied.
  applyThemeUI(html.dataset.theme);

  document.getElementById('themeToggle').addEventListener('click', () => {
    const light = html.dataset.theme !== 'light';
    html.dataset.theme = light ? 'light' : 'dark';
    applyThemeUI(html.dataset.theme);
    updateMinimapViewport();
  });

  // ── Limits ────────────────────────────────────────────────────────────────
  // Hard limits: larger inputs are rejected rather than accepted with a
  // warning. Both are checked, because size in bytes and row count are
  // independent — 200 rows of 2000 characters cost more time than 50000 short
  // ones, so neither figure alone is a reliable guard.
  const MAX_FILE_BYTES = 5 * 1024 * 1024;   // 5 MB
  const MAX_FILE_LINES = 20_000;

  // Above this many DP cells (m × n) the exact LCS is replaced by the greedy
  // fallback. 64M cells ≈ 8000 × 8000 rows, costing about 122 MB for the
  // matrix and 750 ms. Sized to cover switch and WLC configurations, which run
  // to a few thousand lines: a 4600-line pair needs 21M cells, so the previous
  // 25M left almost no headroom. Whenever the fallback kicks in the UI says so.
  const MAX_LCS_CELLS = 64_000_000;

  // ── File loading ──────────────────────────────────────────────────────────
  const fileA = document.getElementById('fileA');
  const fileB = document.getElementById('fileB');
  const btn   = document.getElementById('compareBtn');
  let contentA = null, contentB = null;

  const swapBtn  = document.getElementById('swapBtn');
  const NO_FILE  = 'Datei wählen oder hierher ziehen…';

  function updateFileButtons() {
    btn.disabled     = !(contentA !== null && contentB !== null);
    swapBtn.disabled = contentA === null && contentB === null;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    const kb = bytes / 1024;
    return kb < 1024 ? `${kb.toFixed(1)} KB` : `${(kb / 1024).toFixed(1)} MB`;
  }

  // The local file path is not available in the browser — the File object has
  // none, and input.value deliberately yields only "C:\fakepath\<name>".
  // webkitRelativePath is populated for directory picks only; when present the
  // folder is shown, otherwise size and modification date.
  function fileMeta(file) {
    const rel  = file.webkitRelativePath || '';
    const dir  = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
    const info = `${formatSize(file.size)} · ${new Date(file.lastModified)
      .toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;
    return dir ? `${dir} · ${info}` : info;
  }

  // Report a problem where the affected file is shown, rather than failing
  // silently. Clears the slot so a stale comparison cannot be triggered.
  function showFileError(labelEl, metaEl, slot, message) {
    metaEl.textContent = message;
    metaEl.title       = message;
    metaEl.classList.add('error');
    if (slot === 'A') contentA = null;
    else              contentB = null;
    updateFileButtons();
  }

  // Counts newlines without allocating an array of all lines — the file may be
  // up to MAX_FILE_BYTES, and split() would materialise every row.
  function countLines(text) {
    let n = 1;
    for (let i = 0; i < text.length; i++) {
      if (text.charCodeAt(i) === 10) n++;
    }
    return n;
  }

  function readFile(input, labelEl, metaEl, slot) {
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      labelEl.textContent = file.name;
      labelEl.title       = file.name;          // full name in the tooltip in
      metaEl.textContent  = fileMeta(file);     // case it has to be clipped
      metaEl.title        = metaEl.textContent;
      metaEl.classList.remove('error');

      // Check the size before reading, so an oversized file is never loaded.
      if (file.size > MAX_FILE_BYTES) {
        showFileError(labelEl, metaEl, slot,
          `Datei zu groß: ${formatSize(file.size)} — Maximum ${formatSize(MAX_FILE_BYTES)}`);
        return;
      }

      const reader = new FileReader();

      reader.onload = e => {
        const text = e.target.result;
        if (typeof text !== 'string') {
          showFileError(labelEl, metaEl, slot, 'Datei konnte nicht als Text gelesen werden');
          return;
        }
        // The row count is only known once the text is available.
        const lines = countLines(text);
        if (lines > MAX_FILE_LINES) {
          showFileError(labelEl, metaEl, slot,
            `Zu viele Zeilen: ${lines.toLocaleString('de-DE')} — Maximum ${MAX_FILE_LINES.toLocaleString('de-DE')}`);
          return;
        }
        if (slot === 'A') contentA = text;
        else              contentB = text;
        updateFileButtons();
      };

      reader.onerror = () => {
        // reader.error carries a DOMException such as NotReadableError.
        const reason = reader.error && reader.error.name ? ` (${reader.error.name})` : '';
        showFileError(labelEl, metaEl, slot, `Datei konnte nicht gelesen werden${reason}`);
      };

      reader.onabort = () => {
        showFileError(labelEl, metaEl, slot, 'Lesevorgang abgebrochen');
      };

      // readAsText itself can throw, e.g. when the file vanished after picking.
      try {
        reader.readAsText(file, 'UTF-8');
      } catch (err) {
        showFileError(labelEl, metaEl, slot, `Datei konnte nicht geöffnet werden (${err.name})`);
      }
    });
  }

  readFile(fileA, document.getElementById('labelA'), document.getElementById('metaA'), 'A');
  readFile(fileB, document.getElementById('labelB'), document.getElementById('metaB'), 'B');

  // Swap the original and the comparison file. Any A/B choices made so far are
  // discarded: the LCS tie-break is not symmetric, so diffLines(B,A) may group
  // differently than diffLines(A,B) — carrying choices over by index would
  // attach them to the wrong rows.
  swapBtn.addEventListener('click', () => {
    const la = document.getElementById('labelA');
    const lb = document.getElementById('labelB');
    const ma = document.getElementById('metaA');
    const mb = document.getElementById('metaB');
    [contentA, contentB]             = [contentB, contentA];
    [la.textContent, lb.textContent] = [lb.textContent, la.textContent];
    [la.title, lb.title]             = [lb.title, la.title];
    [ma.textContent, mb.textContent] = [mb.textContent, ma.textContent];
    [ma.title, mb.title]             = [mb.title, ma.title];
    // Move the error state with the metadata it belongs to.
    const aErr = ma.classList.contains('error');
    const bErr = mb.classList.contains('error');
    ma.classList.toggle('error', bErr);
    mb.classList.toggle('error', aErr);
    // The file inputs themselves are not writable; they get cleared so that
    // picking the same file again fires a change event instead of staying mute.
    fileA.value = ''; fileB.value = '';
    updateFileButtons();
    if (contentA !== null && contentB !== null) runCompare();
  });

  btn.addEventListener('click', runCompare);

  // Wraps compare() so an unexpected failure surfaces instead of leaving the
  // UI in a half-built state. Very large inputs are the likeliest trigger.
  function runCompare() {
    if (contentA === null || contentB === null) return;
    try {
      compare(contentA, contentB);
    } catch (err) {
      console.error('compare() failed:', err);
      document.getElementById('diffContainer').innerHTML =
        '<div class="placeholder error">Vergleich fehlgeschlagen — die Dateien sind ' +
        'möglicherweise zu groß.<br>Details in der Browser-Konsole.</div>';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('notice').hidden = true;
      minimapEl.style.display = 'none';
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      navList = []; currentNav = -1;
      updateNavUI();
    }
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let diffGroups = [];   // per block: {rowIndex, type, rows: [op index, …]}
  // Navigation targets for the current selection mode. Each target is a list
  // of consecutive op indices: the whole block per block, a single row per line.
  let navList    = [];
  let currentNav = -1;
  // Scroll sync: whoever scrolled last keeps control for a short while. A plain
  // boolean is not enough — scroll events fire asynchronously, so the flag would
  // already be reset by the time the echo event arrives.
  let scrollOwner     = null;
  let scrollOwnerTime = 0;
  const OWNER_HOLD_MS = 150;

  function claimScroll(name) {
    const now = performance.now();
    if (scrollOwner !== name && now - scrollOwnerTime < OWNER_HOLD_MS) return false;
    scrollOwner     = name;
    scrollOwnerTime = now;
    return true;
  }

  // Mapping between diff rows (op index) and result rows
  let opToLine = [];
  let lineToOp = [];
  let paneObserver = null;
  let allOps      = [];
  let lineMode    = false;

  const prevBtn    = document.getElementById('prevBtn');
  const nextBtn    = document.getElementById('nextBtn');
  const navCounter = document.getElementById('navCounter');
  const modeToggle   = document.getElementById('modeToggle');
  const modeOptLine  = document.getElementById('modeOptLine');
  const modeOptBlock = document.getElementById('modeOptBlock');

  function applyModeUI() {
    // The thumb points at the active side: left = per line, right = per block.
    modeToggle.classList.toggle('on', !lineMode);
    modeOptLine.classList.toggle('active', lineMode);
    modeOptBlock.classList.toggle('active', !lineMode);
  }

  applyModeUI();

  modeToggle.addEventListener('click', () => {
    lineMode = !lineMode;
    applyModeUI();
    // Navigation follows the mode. The current position is preserved: the new
    // target is the one containing the previously highlighted first row.
    if (navList.length) {
      const anchor = navList[currentNav] ? navList[currentNav][0] : null;
      buildNavList(anchor);
      jumpTo(currentNav);
    }
  });

  // Builds the navigation targets for the current selection mode. `anchor` is
  // an op index whose target becomes the current one afterwards.
  function buildNavList(anchor) {
    navList = lineMode
      ? allOps.reduce((acc, op, i) => {
          if (op.type !== 'equal') acc.push([i]);
          return acc;
        }, [])
      : diffGroups.map(g => g.rows);

    if (anchor == null) {
      currentNav = navList.length ? 0 : -1;
      return;
    }
    const idx = navList.findIndex(rows => rows.includes(anchor));
    currentNav = idx >= 0 ? idx : 0;
  }

  prevBtn.addEventListener('click', () => jumpTo(currentNav - 1));
  nextBtn.addEventListener('click', () => jumpTo(currentNav + 1));

  function jumpTo(idx) {
    if (!navList.length) return;
    idx = Math.max(0, Math.min(navList.length - 1, idx));
    currentNav = idx;

    document.querySelectorAll('.current-diff').forEach(el =>
      el.classList.remove('current-diff', 'nav-single', 'nav-first', 'nav-mid', 'nav-last'));

    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');
    if (!sa) return;

    // Mark every row of the target; the edge class follows from the position
    // within the target so that one continuous frame results.
    const rows = navList[idx];
    rows.forEach((r, k) => {
      const edge = rows.length === 1      ? 'nav-single'
                 : k === 0                ? 'nav-first'
                 : k === rows.length - 1  ? 'nav-last'
                 :                          'nav-mid';
      for (const pane of [sa, sb]) {
        const el = pane.children[r];
        if (el) el.classList.add('current-diff', edge);
      }
    });

    const el = sa.children[rows[0]];
    if (el) {
      const target = Math.max(0, el.offsetTop - sa.clientHeight * 0.2);
      claimScroll('nav');
      sa.scrollTop = target;
      sb.scrollTop = target;
      updateMinimapViewport();
      syncDiffToResult(sa);
    }

    updateNavUI();
  }

  function updateNavUI() {
    navCounter.textContent = navList.length
      ? `${currentNav + 1} / ${navList.length}`
      : '–';
    prevBtn.disabled = currentNav <= 0;
    nextBtn.disabled = currentNav >= navList.length - 1;
  }

  // ── Equalise row heights across both panes ────────────────────────────────
  // When a row wraps onto several screen lines its counterpart must take up the
  // same space, otherwise the columns drift apart. This affects blank rows
  // without a counterpart as well as changed rows of differing length.
  function alignRowHeights() {
    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');
    if (!sa || !sb) return;
    const rowsA = sa.children, rowsB = sb.children;
    const n = Math.min(rowsA.length, rowsB.length);

    // First drop all overrides so the natural height is measurable …
    for (let i = 0; i < n; i++) {
      rowsA[i].style.height = '';
      rowsB[i].style.height = '';
    }
    // … then measure in one pass …
    const heights = new Array(n);
    for (let i = 0; i < n; i++) {
      heights[i] = Math.max(rowsA[i].offsetHeight, rowsB[i].offsetHeight);
    }
    // … and only write afterwards (keeps it at 2 reflows instead of 2n).
    for (let i = 0; i < n; i++) {
      rowsA[i].style.height = heights[i] + 'px';
      rowsB[i].style.height = heights[i] + 'px';
    }
  }

  // Width change ⇒ different wrap points ⇒ realign
  let alignPending = false;
  function scheduleAlign() {
    if (alignPending) return;
    alignPending = true;
    requestAnimationFrame(() => {
      alignPending = false;
      alignRowHeights();
      const sa = document.getElementById('scrollA');
      if (sa) { claimScroll('nav'); syncDiffToResult(sa); }
      updateMinimapViewport();
    });
  }

  // ── Scroll sync diff ↔ result (row-exact via opToLine/lineToOp) ───────────
  function resultOpen() {
    const ra = document.getElementById('resultArea');
    return ra && ra.classList.contains('open');
  }

  // Index of the row sitting at the top for scroll position y (binary search)
  function findRowAt(container, y) {
    const rows = container.children;
    if (!rows.length) return 0;
    let lo = 0, hi = rows.length - 1, best = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (rows[mid].offsetTop <= y) { best = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return best;
  }

  function syncDiffToResult(source) {
    const rc = document.getElementById('resultContent');
    if (!rc || !resultOpen() || !rc.children.length) return;
    const i      = findRowAt(source, source.scrollTop);
    const offset = source.scrollTop - source.children[i].offsetTop;
    const target = rc.children[Math.min(rc.children.length - 1, opToLine[i] ?? 0)];
    if (target) rc.scrollTop = Math.max(0, target.offsetTop + offset);
  }

  function syncResultToDiff(rc) {
    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');
    if (!sa || !rc.children.length) return;
    const li     = findRowAt(rc, rc.scrollTop);
    const offset = rc.scrollTop - rc.children[li].offsetTop;
    const rowA   = sa.children[Math.min(sa.children.length - 1, lineToOp[li] ?? 0)];
    if (!rowA) return;
    const target = Math.max(0, rowA.offsetTop + offset);
    sa.scrollTop = target;
    sb.scrollTop = target;
    updateMinimapViewport();
  }

  // ── Minimap ───────────────────────────────────────────────────────────────
  const minimapEl    = document.getElementById('minimap');
  const minimapTrack = document.getElementById('minimapTrack');
  const minimapVP    = document.getElementById('minimapViewport');

  function buildMinimap(ops, totalRows) {
    minimapTrack.innerHTML = '';
    if (!totalRows) return;
    const mapH = minimapEl.clientHeight || 400;
    const segH = Math.max(2, mapH / totalRows);
    ops.forEach((op, i) => {
      if (op.type === 'equal') return;
      const seg = document.createElement('div');
      seg.className = `minimap-seg ${op.type}`;
      seg.style.top    = `${(i / totalRows) * mapH}px`;
      seg.style.height = `${segH}px`;
      minimapTrack.appendChild(seg);
    });
  }

  function updateMinimapViewport() {
    const sa = document.getElementById('scrollA');
    if (!sa || minimapEl.style.display === 'none') return;
    const mapH   = minimapEl.clientHeight;
    const totalH = sa.scrollHeight;
    const viewH  = sa.clientHeight;
    minimapVP.style.top    = `${(sa.scrollTop / totalH) * mapH}px`;
    minimapVP.style.height = `${Math.max(4, (viewH / totalH) * mapH)}px`;
  }

  minimapEl.addEventListener('click', e => {
    const sa = document.getElementById('scrollA');
    if (!sa) return;
    const rect  = minimapEl.getBoundingClientRect();
    const ratio = (e.clientY - rect.top) / minimapEl.clientHeight;
    sa.scrollTop = ratio * sa.scrollHeight;
  });

  // ── LCS ───────────────────────────────────────────────────────────────────
  function lcs(a, b) {
    const m = a.length, n = b.length;
    if (m * n > MAX_LCS_CELLS) return fastLcs(a, b);
    const dp = Array.from({length: m + 1}, () => new Uint16Array(n + 1));
    for (let i = m - 1; i >= 0; i--)
      for (let j = n - 1; j >= 0; j--)
        dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1
                                  : Math.max(dp[i+1][j], dp[i][j+1]);
    const seq = [];
    let i = 0, j = 0;
    while (i < m && j < n) {
      if (a[i] === b[j]) { seq.push([i, j]); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) i++;
      else j++;
    }
    return seq;
  }

  // Greedy fallback for inputs too large for the DP matrix. Runs once through a
  // and always takes the earliest still-available match in b.
  //
  // It records *every* position of each line and binary-searches the first one
  // at or after the cursor. Keeping only the first position — as an earlier
  // version did — makes this collapse on files with many recurring lines: once
  // the cursor has passed that single recorded position, no further match is
  // ever found. On a pair of real 4600-line switch configs that meant 529
  // instead of 4450 common lines, i.e. almost everything reported as changed.
  //
  // Still an approximation, not an exact LCS: because it always grabs the
  // earliest match, it stays weaker than the DP on deletions and moved blocks.
  function fastLcs(a, b) {
    const positions = new Map();
    for (let i = 0; i < b.length; i++) {
      let list = positions.get(b[i]);
      if (!list) { list = []; positions.set(b[i], list); }
      list.push(i);
    }

    const seq = [];
    let cursor = 0;
    for (let i = 0; i < a.length; i++) {
      const list = positions.get(a[i]);
      if (!list) continue;
      // First entry >= cursor; the lists are ascending by construction.
      let lo = 0, hi = list.length - 1, hit = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (list[mid] >= cursor) { hit = list[mid]; hi = mid - 1; }
        else                       lo = mid + 1;
      }
      if (hit >= 0) { seq.push([i, hit]); cursor = hit + 1; }
    }
    return seq;
  }

  function diffLines(linesA, linesB) {
    const common = lcs(linesA, linesB);
    const ops = [];
    let ia = 0, ib = 0, ci = 0;
    while (ci < common.length || ia < linesA.length || ib < linesB.length) {
      const ca = ci < common.length ? common[ci][0] : linesA.length;
      const cb = ci < common.length ? common[ci][1] : linesB.length;
      const removedBlock = linesA.slice(ia, ca);
      const addedBlock   = linesB.slice(ib, cb);
      const maxLen = Math.max(removedBlock.length, addedBlock.length);
      for (let k = 0; k < maxLen; k++) {
        if (k < removedBlock.length && k < addedBlock.length)
          ops.push({type: 'changed', textA: removedBlock[k], textB: addedBlock[k]});
        else if (k < removedBlock.length)
          ops.push({type: 'removed', textA: removedBlock[k], textB: null});
        else
          ops.push({type: 'added',   textA: null, textB: addedBlock[k]});
      }
      if (ci < common.length) {
        ops.push({type: 'equal', textA: linesA[ca], textB: linesB[cb]});
        ia = ca + 1; ib = cb + 1; ci++;
      } else {
        ia = linesA.length; ib = linesB.length;
      }
    }
    return ops;
  }

  // Character-level diff within a changed row.
  function charDiff(a, b) {
    if (a === b) return [escHtml(a), escHtml(b)];
    const oa = [], ob = [];
    const common = lcs([...a], [...b]);
    let ia = 0, ib = 0, ci = 0;
    function flush(arrA, arrB, ca, cb) {
      const ra = a.slice(ia, ca), rb = b.slice(ib, cb);
      if (ra) arrA.push(`<mark class="changed">${escHtml(ra)}</mark>`);
      if (rb) arrB.push(`<mark class="changed">${escHtml(rb)}</mark>`);
    }
    while (ci <= common.length) {
      const ca = ci < common.length ? common[ci][0] : a.length;
      const cb = ci < common.length ? common[ci][1] : b.length;
      flush(oa, ob, ca, cb);
      if (ci < common.length) {
        const ch = escHtml(a[ca]);
        oa.push(ch); ob.push(ch);
        ia = ca + 1; ib = cb + 1;
      }
      ci++;
    }
    return [oa.join(''), ob.join('')];
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Merge helpers ─────────────────────────────────────────────────────────
  function setChoice(opIdx, choice) {
    const op = allOps[opIdx];
    if (!op || op.type === 'equal') return;
    op.choice = op.choice === choice ? null : choice;
    if (!lineMode) {
      allOps.forEach((o, i) => {
        if (i !== opIdx && o.groupIdx === op.groupIdx && o.type !== 'equal')
          o.choice = op.choice;
      });
    }
    updateMergeHighlights();
  }

  // Returns the result text along with the render items. Omitted rows would
  // otherwise leave no trace — a marker item is produced for them that is only
  // displayed and does not enter `lines` (and thus not the export). That is why
  // opToLine/lineToOp point at positions in `items`: the scroll sync works off
  // the DOM children.
  function computeResult() {
    const lines = [];   // real rows only → export
    const items = [];   // rows plus gap markers → display
    opToLine = [];
    lineToOp = [];

    // Two causes for a gap, counted separately: an A row was removed (the
    // chosen B version lacks it) or a B row was not taken over. Calling the
    // latter "removed" would be factually wrong.
    let gapRemoved = 0, gapSkipped = 0, gapFirstOp = -1;

    const flushGap = () => {
      const total = gapRemoved + gapSkipped;
      if (!total) return;
      const plural = total !== 1 ? 'n' : '';
      const label = gapSkipped === 0 ? `${total} Zeile${plural} entfernt`
                  : gapRemoved === 0 ? `${total} Zeile${plural} nicht übernommen`
                  :                    `${total} Zeile${plural} ausgelassen`;
      lineToOp[items.length] = gapFirstOp;
      items.push({ kind: 'gap', label });
      gapRemoved = 0; gapSkipped = 0; gapFirstOp = -1;
    };

    allOps.forEach((op, oi) => {
      const text = op.type === 'equal' ? op.textA
                 : op.choice === 'B'   ? op.textB
                 :                       op.textA;   // null or 'A'

      if (text === null) {
        // This row drops out of the result — collect the gap.
        if (gapFirstOp < 0) gapFirstOp = oi;
        if (op.textA !== null) gapRemoved++;   // an A row falls away
        else                   gapSkipped++;   // a B row was not taken over
        opToLine[oi] = items.length;           // position of the upcoming marker
        return;
      }

      flushGap();
      opToLine[oi] = items.length;
      lineToOp[items.length] = oi;
      items.push({ kind: 'line', text, num: lines.length + 1,
                   isDiff: op.type !== 'equal' });
      lines.push(text);
    });

    flushGap();   // gap at the end of the file

    return { text: lines.join('\n'), lines, items };
  }

  function renderResult() {
    const nameA = document.getElementById('labelA').textContent;
    document.getElementById('resultLabel').textContent = `Ergebnis (Basis: ${nameA})`;

    const r = computeResult();
    document.getElementById('resultContent').innerHTML = r.items.map(it => {
      if (it.kind === 'gap') {
        return `<div class="line gap-line" title="${it.label}"><span class="line-num">&#8943;</span><span class="line-text">${it.label}</span></div>`;
      }
      return `<div class="line${it.isDiff ? ' diff-line' : ''}"><span class="line-num">${it.num}</span><span class="line-text">${escHtml(it.text)}</span></div>`;
    }).join('');

    // After the rebuild scrollTop is 0 — restore the position from the diff
    // panes. claimScroll keeps the resulting scroll event from pulling the diff
    // panes back to the top.
    const sa = document.getElementById('scrollA');
    if (sa) { claimScroll('nav'); syncDiffToResult(sa); }

    const countB    = allOps.filter(o => o.choice === 'B').length;
    const countA    = allOps.filter(o => o.choice === 'A').length;
    const countOpen = allOps.filter(o => o.type !== 'equal' && o.choice === null).length;
    const parts = [];
    if (countB)    parts.push(`${countB}× B`);
    if (countA)    parts.push(`${countA}× A`);
    if (countOpen) parts.push(`${countOpen} offen`);
    document.getElementById('resultHint').textContent = parts.join(' · ') || '–';
  }

  function updateMergeHighlights() {
    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');
    if (!sa || !sb) return;

    // Arrows live in both panes.
    document.querySelectorAll('.pane-content .merge-btn').forEach(btn => {
      const op = allOps[parseInt(btn.dataset.op)];
      if (!op) return;
      btn.classList.toggle('active', op.choice === btn.dataset.choice);
    });

    // Mark the row that is currently chosen.
    for (let i = 0; i < allOps.length; i++) {
      const choice = allOps[i].choice;
      const rowA = sa.children[i];
      const rowB = sb.children[i];
      if (rowA) rowA.classList.toggle('chosen', choice === 'A');
      if (rowB) rowB.classList.toggle('chosen', choice === 'B');
    }

    renderResult();
  }

  // ── Result area ───────────────────────────────────────────────────────────
  document.getElementById('resultToggle').addEventListener('click', () => {
    document.getElementById('resultArea').classList.toggle('open');
    // Align the scroll position right away when the panel opens.
    const sa = document.getElementById('scrollA');
    if (sa) { claimScroll('nav'); syncDiffToResult(sa); }
  });

  // Drag the height of the merge area. Dragging up enlarges it; the diff area
  // keeps at least MIN_DIFF_H, the panel at least MIN_PANEL_H.
  const resizer = document.getElementById('resultResizer');
  const MIN_PANEL_H = 90;
  const MIN_DIFF_H  = 120;

  resizer.addEventListener('pointerdown', e => {
    const panels  = document.querySelector('.result-panels');
    const wrapper = document.querySelector('.diff-wrapper');
    const startY  = e.clientY;
    const startH  = panels.offsetHeight;
    const maxH    = startH + Math.max(0, wrapper.offsetHeight - MIN_DIFF_H);

    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';

    const onMove = ev => {
      const h = Math.min(maxH, Math.max(MIN_PANEL_H, startH + (startY - ev.clientY)));
      panels.style.height = h + 'px';
      updateMinimapViewport();
    };

    const onUp = () => {
      resizer.classList.remove('dragging');
      document.body.style.userSelect = '';
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      // Realign the result with the diff panes.
      const sa = document.getElementById('scrollA');
      if (sa) { claimScroll('nav'); syncDiffToResult(sa); }
    };

    // On window rather than on the grip: the pointer leaves the 6px strip
    // immediately while dragging, yet the movement still has to arrive.
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    e.preventDefault();
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const resultBtn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(computeResult().text);
      const original = resultBtn.textContent;
      resultBtn.textContent = 'Kopiert';
      setTimeout(() => { resultBtn.textContent = original; }, 1200);
    } catch (err) {
      // Denied clipboard permission or an insecure context land here.
      console.error('clipboard write failed:', err);
      const original = resultBtn.textContent;
      resultBtn.textContent = 'Fehlgeschlagen';
      setTimeout(() => { resultBtn.textContent = original; }, 1800);
    }
  });

  function downloadText(text, filename) {
    const blob = new Blob([text], {type: 'text/plain'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const name = document.getElementById('labelA').textContent;
    downloadText(computeResult().text,
      name !== NO_FILE ? 'merged_' + name : 'ergebnis.txt');
  });

  // ── Render ────────────────────────────────────────────────────────────────
  function compare(textA, textB) {
    const linesA = textA.split('\n');
    const linesB = textB.split('\n');

    // Say so when the exact LCS is out of reach. Without this note a result of
    // "everything changed" looks like a defect rather than a known limitation.
    const notice = document.getElementById('notice');
    if (linesA.length * linesB.length > MAX_LCS_CELLS) {
      notice.textContent =
        `Hinweis: Bei dieser Zeilenzahl (${linesA.length.toLocaleString('de-DE')} / ` +
        `${linesB.length.toLocaleString('de-DE')}) wird ein Näherungsverfahren verwendet. ` +
        `Bei Dateien mit vielen wiederkehrenden Zeilen kann es mehr Unterschiede anzeigen, ` +
        `als tatsächlich bestehen.`;
      notice.hidden = false;
    } else {
      notice.hidden = true;
    }

    const ops = diffLines(linesA, linesB);
    allOps = ops;

    let numA = 0, numB = 0;
    const stats     = {added: 0, removed: 0, changed: 0};
    const leftRows  = [];
    const rightRows = [];
    const newGroups = [];
    let inDiffGroup = false;
    let groupIdx    = -1;

    // Empty merge-cell for the opposite pane, same width → identical text width
    const emptyCell = `<span class="merge-cell"></span>`;

    for (let i = 0; i < ops.length; i++) {
      const op = ops[i];
      op.choice = null;

      if (op.type !== 'equal' && !inDiffGroup) {
        groupIdx++;
        newGroups.push({rowIndex: i, type: op.type, rows: []});
        inDiffGroup = true;
      }
      if (op.type === 'equal') inDiffGroup = false;
      op.groupIdx = op.type !== 'equal' ? groupIdx : -1;
      if (op.type !== 'equal') newGroups[groupIdx].rows.push(i);

      // The arrow in A points right, the one in B points left: both face the
      // opposite side and mean "this version applies".
      const cellA = op.type !== 'equal'
        ? `<span class="merge-cell"><button class="merge-btn" data-op="${i}" data-choice="A" title="A-Version übernehmen">&#8594;</button></span>`
        : emptyCell;
      const cellB = op.type !== 'equal'
        ? `<span class="merge-cell"><button class="merge-btn" data-op="${i}" data-choice="B" title="B-Version übernehmen">&#8592;</button></span>`
        : emptyCell;

      if (op.type === 'equal') {
        numA++; numB++;
        const t = escHtml(op.textA);
        leftRows.push (`<div class="line"><span class="line-num">${numA}</span><span class="line-text">${t}</span>${emptyCell}</div>`);
        rightRows.push(`<div class="line"><span class="line-num">${numB}</span>${emptyCell}<span class="line-text">${t}</span></div>`);
      } else if (op.type === 'changed') {
        numA++; numB++; stats.changed++;
        const [hA, hB] = charDiff(op.textA, op.textB);
        leftRows.push (`<div class="line changed"><span class="line-num">${numA}</span><span class="line-text">${hA}</span>${cellA}</div>`);
        rightRows.push(`<div class="line changed"><span class="line-num">${numB}</span>${cellB}<span class="line-text">${hB}</span></div>`);
      } else if (op.type === 'removed') {
        numA++; stats.removed++;
        leftRows.push (`<div class="line removed"><span class="line-num">${numA}</span><span class="line-text">${escHtml(op.textA)}</span>${cellA}</div>`);
        rightRows.push(`<div class="line empty"><span class="line-num"> </span>${cellB}<span class="line-text"> </span></div>`);
      } else {
        numB++; stats.added++;
        leftRows.push (`<div class="line empty"><span class="line-num"> </span><span class="line-text"> </span>${cellA}</div>`);
        rightRows.push(`<div class="line added"><span class="line-num">${numB}</span>${cellB}<span class="line-text">${escHtml(op.textB)}</span></div>`);
      }
    }

    diffGroups = newGroups;
    buildNavList(null);

    const nameA     = document.getElementById('labelA').textContent;
    const nameB     = document.getElementById('labelB').textContent;
    const statsHtml = `<span class="stats">+${stats.added} &nbsp;~${stats.changed} &nbsp;-${stats.removed}</span>`;

    document.getElementById('diffContainer').innerHTML = `
      <div class="diff-pane">
        <div class="pane-header"><span>A: ${escHtml(nameA)}</span>${statsHtml}</div>
        <div class="pane-content" id="scrollA">${leftRows.join('')}</div>
      </div>
      <div class="diff-pane">
        <div class="pane-header"><span>B: ${escHtml(nameB)}</span></div>
        <div class="pane-content" id="scrollB">${rightRows.join('')}</div>
      </div>`;

    const sa = document.getElementById('scrollA');
    const sb = document.getElementById('scrollB');

    // Equalise heights before anything reads offsetTop.
    alignRowHeights();

    // Only the width shifts the wrap points. Height changes — such as while
    // dragging the merge area — are skipped, otherwise the height pass would
    // run on every frame of the drag.
    if (paneObserver) paneObserver.disconnect();
    let lastPaneWidth = sa.clientWidth;
    paneObserver = new ResizeObserver(() => {
      if (sa.clientWidth === lastPaneWidth) return;
      lastPaneWidth = sa.clientWidth;
      scheduleAlign();
    });
    paneObserver.observe(sa);

    sa.addEventListener('scroll', () => {
      if (!claimScroll('A')) return;
      sb.scrollTop = sa.scrollTop;
      updateMinimapViewport();
      syncDiffToResult(sa);
    });

    sb.addEventListener('scroll', () => {
      if (!claimScroll('B')) return;
      sa.scrollTop = sb.scrollTop;
      updateMinimapViewport();
      syncDiffToResult(sb);
    });

    // Scrolling in the merge result feeds back to the diff panes.
    const rc = document.getElementById('resultContent');
    rc.addEventListener('scroll', () => {
      if (!claimScroll('R')) return;
      syncResultToDiff(rc);
    });

    // Arrows sit in both panes, so listen on both.
    const onMergeClick = e => {
      const mbtn = e.target.closest('.merge-btn');
      if (!mbtn) return;
      setChoice(parseInt(mbtn.dataset.op), mbtn.dataset.choice);
    };
    sa.addEventListener('click', onMergeClick);
    sb.addEventListener('click', onMergeClick);

    minimapEl.style.display = 'block';
    buildMinimap(ops, ops.length);
    updateMinimapViewport();
    sa.addEventListener('scroll', updateMinimapViewport);

    prevBtn.disabled = false;
    nextBtn.disabled = false;
    updateNavUI();
    if (navList.length) jumpTo(0);

    document.getElementById('resultArea').style.display = '';
    renderResult();
  }

  // ── Footer ────────────────────────────────────────────────────────────────
  document.getElementById('appVersion').textContent = `v${APP_VERSION}`;
</script>
</body>
</html>
